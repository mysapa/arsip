<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dashboard Arsip MySAPA</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;margin:0;padding:0;overflow-x:hidden}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f1f5f9;display:flex;flex-direction:column;min-height:100vh}

.header-banner{width:100%;background:linear-gradient(135deg,#003366 0%,#00529c 50%,#0072ce 100%);color:#fff;padding:30px 0 75px;border-radius:0 0 32px 32px;box-shadow:0 10px 25px rgba(0,51,102,.25);overflow:hidden}
.header-container{width:100%;max-width:1200px;margin:auto;padding:0 20px}
.brand-box{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;transform:translateY(-5px)}
.header-title-group{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.app-title{font-weight:800;font-size:22px;margin:0;line-height:1.2;word-break:break-word}
.app-subtitle{font-size:16px;opacity:.85;font-weight:500;margin-top:2px}

.main-container{width:100%;max-width:1200px;margin:-50px auto 0;padding:0 20px 20px;flex:1;position:relative;z-index:5;overflow:hidden}

.stat-card{width:100%;background:#fff;border-radius:20px;padding:14px 10px;border:2px solid transparent;box-shadow:0 10px 25px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;height:100%;min-width:0;cursor:pointer;transition:.25s;user-select:none}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,.12)}
.stat-card.active{background:linear-gradient(135deg,#00529c,#0072ce);box-shadow:0 10px 25px rgba(0,82,156,.35)}
.stat-card.active .stat-title{color:rgba(255,255,255,.88)}
.stat-card.active .stat-value{color:#fff}
.stat-card.active .stat-icon{background:rgba(255,255,255,.22)!important;color:#fff!important}
.stat-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stat-title{font-size:18px;color:#64748b;font-weight:600;letter-spacing:.5px;margin:8px 0 0;min-height:28px;display:flex;align-items:center;justify-content:center;line-height:1.2}
.stat-value{font-size:24px;font-weight:800;color:#0f172a;margin:4px 0 0}

.card-content{width:100%;background:transparent;padding:0}
.table-scroll-container{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;border-radius:0;border:1px solid #cbd5e1;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.03)}
.custom-table-horizontal{margin-bottom:0;width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
.custom-table-horizontal th.sticky-col{position:sticky;left:0;z-index:10;background:#f8fafc!important;color:#334155;font-weight:700;font-size:.85rem;border-right:2px solid #cbd5e1;border-bottom:1px solid #e2e8f0;padding:10px 14px;width:1%;white-space:nowrap;box-shadow:3px 0 6px rgba(0,0,0,.04);text-align:left}
.custom-table-horizontal td{padding:10px 16px;font-size:.9rem;color:#334155;text-align:left;min-width:180px;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;vertical-align:middle;background:#fff}
.custom-table-horizontal tr:last-child th.sticky-col,.custom-table-horizontal tr:last-child td{border-bottom:none}

/* Semua teks tabel berwarna hitam */
.custom-table-horizontal,.custom-table-horizontal th,.custom-table-horizontal td,
.custom-table-horizontal .text-primary,.custom-table-horizontal .text-dark,
.custom-table-horizontal .text-muted,.custom-table-horizontal .badge-jenis{color:#000!important}
.custom-table-horizontal tr.row-jumlah th.sticky-col,.custom-table-horizontal tr.row-jumlah td{font-weight:800}
.custom-table-horizontal tr.row-jumlah td{background:#f8fafc}

/* Tabel Inventaris: semua kolom data berlebar sama, teks panjang turun ke baris berikutnya */
:root{--inv-col:150px}
#tableInv td:not(.p-4){width:var(--inv-col);min-width:var(--inv-col);max-width:var(--inv-col);white-space:normal;overflow-wrap:anywhere;text-align:center}

/* Tabel vertikal (Surat Pengantar): judul kolom di atas, data per baris */
.custom-table-vertical{margin-bottom:0;width:100%;border-collapse:separate;border-spacing:0}
.sp-scroll{overflow-y:auto;overflow-x:hidden}
.custom-table-vertical th:nth-child(1){width:45%}
.custom-table-vertical th:nth-child(2){width:20%}
.custom-table-vertical th:nth-child(3){width:35%}
.custom-table-vertical td{overflow-wrap:anywhere}
.custom-table-vertical thead th{position:sticky;top:0;z-index:5}
.custom-table-vertical th{background:#f8fafc!important;color:#000!important;font-weight:700;font-size:.85rem;padding:10px 14px;text-align:left;white-space:nowrap;border-right:1px solid #e2e8f0;border-bottom:2px solid #cbd5e1}
.custom-table-vertical td{background:#fff;color:#000!important;font-size:.9rem;padding:10px 14px;text-align:left;vertical-align:middle;border-right:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0}
.custom-table-vertical th:last-child,.custom-table-vertical td:last-child{border-right:none}
.custom-table-vertical tr:last-child td{border-bottom:none}

.badge-jenis{background:#e0f2fe;color:#0369a1;font-weight:600;padding:6px 12px;border-radius:8px;font-size:.78rem;display:inline-block}
.badge-masuk{background:#dcfce7}
.badge-keluar{background:#ffedd5}
.btn-link-arsip{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe;border-radius:10px;padding:5px 12px;font-weight:600;font-size:.82rem;text-decoration:none;transition:.2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-link-arsip:hover{background:#2563eb;color:#fff}

.search-box{position:relative;width:100%}
.search-box input{width:100%;border-radius:12px;padding-left:40px;border:1px solid #cbd5e1;background:#fff}
.search-box i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94a3b8;z-index:2}

#loadingSpinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 0;width:100%}
footer{width:100%;text-align:center;padding:12px 20px;font-size:12px;font-weight:400;color:#808080;margin-top:0}

@media(max-width:576px){
.header-banner{padding:25px 0 68px;border-radius:0 0 26px 26px}
.header-container{padding:0 10px}
.brand-box{gap:5px}
.app-subtitle{font-size:12px}
.app-title{font-size:16px}
.main-container{margin-top:-40px;padding:0 10px 15px}
.row{--bs-gutter-x:.5rem;margin-left:0;margin-right:0}
.row>*{padding-left:.25rem;padding-right:.25rem}
.stat-card{padding:10px 4px;border-radius:16px}
.stat-icon{width:36px;height:36px;font-size:17px;border-radius:11px}
.stat-title{font-size:10.5px;min-height:26px;letter-spacing:0}
.stat-value{font-size:18px}
.search-box{margin-bottom:10px!important}
.search-box input{height:42px;font-size:13px}
.custom-table-horizontal th.sticky-col{font-size:.75rem;padding:8px 9px}
.custom-table-horizontal td{font-size:.78rem;min-width:145px;padding:8px 10px}
:root{--inv-col:130px}
.custom-table-vertical th{font-size:.75rem;padding:8px 9px}
.custom-table-vertical td{font-size:.78rem;padding:8px 9px}
.badge-jenis{font-size:.7rem;padding:5px 8px}
.btn-link-arsip{font-size:.72rem;padding:4px 8px;gap:4px}
}

@media(max-width:360px){
.header-container{padding:0 8px}
.main-container{padding-left:8px;padding-right:8px}
.app-title{font-size:16px}
.app-subtitle{font-size:13px}
.stat-card{padding-left:2px;padding-right:2px}
.stat-title{font-size:12px}
.stat-value{font-size:20px}
}
</style>
</head>

<body>

<div class="header-banner">
  <div class="header-container">
    <div class="brand-box">
      <div class="header-title-group">
        <h3 class="app-title"><i class="fa-solid fa-folder-open"></i> Manajerial</h3>
        <span class="app-subtitle">Dokumen dan Aset</span>
      </div>
    </div>
  </div>
</div>

<div class="main-container">

  <div class="row g-2 mb-3">
    <div class="col-4">
      <div class="stat-card active" id="cardSurat" onclick="switchTab('surat')">
        <div class="stat-icon bg-primary-subtle text-primary"><i class="fa-solid fa-envelope"></i></div>
        <div><p class="stat-title">Korespondensi</p><h3 class="stat-value" id="countSurat">0</h3></div>
      </div>
    </div>

    <div class="col-4">
      <div class="stat-card" id="cardSP" onclick="switchTab('sp')">
        <div class="stat-icon bg-success-subtle text-success"><i class="fa-solid fa-file-signature"></i></div>
        <div><p class="stat-title">Surat Pengantar</p><h3 class="stat-value" id="countSP">0</h3></div>
      </div>
    </div>

    <div class="col-4">
      <div class="stat-card" id="cardInv" onclick="switchTab('inv')">
        <div class="stat-icon" style="background:#f3e8ff;color:#9333ea"><i class="fa-solid fa-boxes-stacked"></i></div>
        <div><p class="stat-title">Inventaris RT</p><h3 class="stat-value" id="countInv">0</h3></div>
      </div>
    </div>
  </div>

  <div class="search-box mb-3">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" id="searchInput" class="form-control" placeholder="Cari data..." onkeyup="filterTable()">
  </div>

  <div id="loadingSpinner">
    <div class="spinner-border text-primary mb-2" role="status"></div>
    <span class="text-muted fw-semibold" id="loadingText">Memuat data...</span>
  </div>

  <div class="card-content d-none" id="contentArea">
    <div class="tab-content" id="arsipTabsContent">

      <div class="tab-pane fade show active" id="surat-panel">
        <div class="table-scroll-container">
          <table class="table custom-table-horizontal align-middle" id="tableSurat"></table>
        </div>
      </div>

      <div class="tab-pane fade" id="sp-panel">
        <div class="table-scroll-container sp-scroll" id="spScroll">
          <table class="table custom-table-vertical align-middle" id="tableSP"></table>
        </div>
      </div>

      <div class="tab-pane fade" id="inv-panel">
        <div class="table-scroll-container">
          <table class="table custom-table-horizontal align-middle" id="tableInv"></table>
        </div>
      </div>

    </div>
  </div>
</div>

<footer>Powered by Anto Design Concept &copy; 2026</footer>

<script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbyHW_utJeLcP8Oxb9RvrR-et6QU78CRr-_KOtj-_glx8lSFXwwGpMV5F5Q74XNabSjm/exec';
const CACHE_KEY='arsipMySAPA_cache_v2';
const MIN_GAP_MS=30000; // jeda minimal antar pembaruan saat tab kembali aktif
let currentTab='surat',globalData=null,lastRaw='',isFetching=false,lastFetch=0;

window.onload=()=>{
  // Tampilkan data tersimpan (jika ada) agar halaman langsung terisi, lalu perbarui di latar belakang
  const cached=readCache();
  if(cached){
    globalData=cached.data;
    lastRaw=cached.raw;
    showContent();
    filterTable();
  }
  loadData();
};

// Saat tab kembali aktif, sinkron ulang (dibatasi minimal 30 detik sejak pembaruan terakhir)
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&Date.now()-lastFetch>MIN_GAP_MS)loadData();
});

function readCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw)return null;
    const data=JSON.parse(raw);
    return data&&data.success?{data,raw}:null;
  }catch(e){
    return null;
  }
}

function saveCache(raw){
  try{localStorage.setItem(CACHE_KEY,raw);}catch(e){}
}

function showContent(){
  document.getElementById('loadingSpinner').classList.add('d-none');
  document.getElementById('contentArea').classList.remove('d-none');
}

/* Data diambil sekali saat halaman dibuka (dan saat tab kembali aktif), tanpa polling berkala. */
function loadData(){
  if(isFetching)return;
  isFetching=true;

  fetch(WEB_APP_URL,{cache:'no-store'})
    .then(response=>response.text())
    .then(renderData)
    .catch(handleError)
    .finally(()=>{
      isFetching=false;
      lastFetch=Date.now();
    });
}

function renderData(raw){
  // Data tidak berubah: tidak perlu parse dan render ulang
  if(raw===lastRaw&&globalData){
    showContent();
    return;
  }

  const res=JSON.parse(raw);

  if(!res.success){
    console.error('Gagal memperbarui data: '+res.error);
    return;
  }

  globalData=res;
  lastRaw=raw;
  saveCache(raw);
  showContent();
  filterTable();
}

function handleError(err){
  console.error('Terjadi kesalahan sinkronisasi: '+err);
  if(!globalData){
    document.getElementById('loadingText').innerText='Gagal memuat data, mencoba lagi...';
  }
}


/* =========================
   HELPER
   ========================= */

const BULAN_SINGKAT=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN_INDEX={jan:0,feb:1,mar:2,apr:3,mei:4,may:4,jun:5,jul:6,agu:7,agt:7,aug:7,sep:8,okt:9,oct:9,nov:10,nop:10,des:11,dec:11};

/* Ubah berbagai format tanggal menjadi "dd mmm yyyy" (contoh: 15 Jan 2026) */
function formatTanggal(val){
  if(val===null||val===undefined||val==='')return '-';

  const fmt=(d,m,y)=>`${String(d).padStart(2,'0')} ${BULAN_SINGKAT[m]} ${y}`;
  const fromDate=dt=>fmt(dt.getDate(),dt.getMonth(),dt.getFullYear());
  let m;

  if(val instanceof Date)return isNaN(val)?'-':fromDate(val);
  if(typeof val==='number')return fromDate(new Date(val));

  const s=String(val).trim();

  // 2026-01-15
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return fmt(+m[3],+m[2]-1,m[1]);

  // 15/01/2026, 15-01-2026, 15.01.2026
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/)))return fmt(+m[1],+m[2]-1,m[3]);

  // 2026-01-14T16:00:00.000Z (ISO dengan jam, dikonversi ke zona waktu perangkat)
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)){
    const dt=new Date(s);
    if(!isNaN(dt))return fromDate(dt);
  }

  // Thu Jan 15 2026 00:00:00 GMT+0800 (...)  -> diambil langsung, tanpa konversi zona waktu
  if((m=s.match(/^[A-Za-z]{3},?\s+([A-Za-z]{3})[A-Za-z]*\s+(\d{1,2})\s+(\d{4})/))){
    const idx=BULAN_INDEX[m[1].toLowerCase()];
    if(idx!==undefined)return fmt(+m[2],idx,m[3]);
  }

  // 15 Januari 2026 / 15 Jan 2026
  if((m=s.match(/^(\d{1,2})\s+([A-Za-z]+)\s+(\d{4})$/))){
    const idx=BULAN_INDEX[m[2].slice(0,3).toLowerCase()];
    if(idx!==undefined)return fmt(+m[1],idx,m[3]);
  }

  const dt=new Date(s);
  return isNaN(dt)?s:fromDate(dt);
}

/* Cegah karakter HTML dari data spreadsheet merusak tampilan */
function escapeHtml(text){
  return String(text??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* Hanya izinkan link http/https */
function safeUrl(url){
  const u=String(url??'').trim();
  return /^https?:\/\//i.test(u)?escapeHtml(u):'';
}


/* =========================
   RENDER SURAT
   ========================= */

/* Warna latar jenis surat: masuk = hijau, keluar = oranye, lainnya = biru muda */
function badgeJenisClass(jenis){
  const j=String(jenis??'').toLowerCase();
  if(j.includes('masuk'))return 'badge-masuk';
  if(j.includes('keluar'))return 'badge-keluar';
  return '';
}

function renderSuratHorizontal(list){
  const table=document.getElementById('tableSurat');

  if(!list||!list.length){
    table.innerHTML='<tbody><tr><td class="text-center text-muted p-4">Tidak ada data surat.</td></tr></tbody>';
    return;
  }

  let rowNo='<tr><th class="sticky-col">No. Surat</th>',
      rowTgl='<tr><th class="sticky-col">Tanggal</th>',
      rowJenis='<tr><th class="sticky-col">Jenis Surat</th>',
      rowPerihal='<tr><th class="sticky-col">Perihal</th>',
      rowArsip='<tr><th class="sticky-col">Arsip</th>';

  list.forEach(item=>{
    const link=safeUrl(item.linkArsip);
    const btnLink=link
      ? `<a href="${link}" target="_blank" rel="noopener noreferrer" class="btn-link-arsip"><i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Link</a>`
      : '<span class="text-muted small">-</span>';

    rowNo+=`<td class="fw-semibold text-primary">${escapeHtml(item.noSurat||'-')}</td>`;
    rowTgl+=`<td class="text-nowrap">${formatTanggal(item.tanggal)}</td>`;
    rowJenis+=`<td><span class="badge-jenis ${badgeJenisClass(item.jenisSurat)}">${escapeHtml(item.jenisSurat||'Lainnya')}</span></td>`;
    rowPerihal+=`<td class="text-wrap" style="max-width:180px">${escapeHtml(item.perihal||'-')}</td>`;
    rowArsip+=`<td class="text-center">${btnLink}</td>`;
  });

  table.innerHTML=`<tbody>${rowNo}</tr>${rowTgl}</tr>${rowJenis}</tr>${rowPerihal}</tr>${rowArsip}</tr></tbody>`;
}


/* =========================
   RENDER SURAT PENGANTAR
   ========================= */

function renderSPVertical(list){
  const table=document.getElementById('tableSP');

  if(!list||!list.length){
    table.innerHTML='<tbody><tr><td class="text-center p-4">Tidak ada data surat pengantar.</td></tr></tbody>';
    return;
  }

  const rows=list.map(item=>`<tr>
      <td class="fw-semibold">${escapeHtml(item.noSurat||'-').replace(/\//g,'/<wbr>')}</td>
      <td class="text-nowrap">${escapeHtml(formatTanggal(item.tanggal))}</td>
      <td>${escapeHtml(item.perihal||'-')}</td>
    </tr>`).join('');

  table.innerHTML=`<thead><tr><th>No. Surat</th><th>Tanggal</th><th>Perihal</th></tr></thead><tbody>${rows}</tbody>`;
  limitSPHeight();
}

/* Tampilkan 5 baris data; selebihnya digulir (tinggi dihitung dari tinggi baris sebenarnya) */
const SP_VISIBLE_ROWS=5;
function limitSPHeight(){
  const box=document.getElementById('spScroll'),
        head=document.querySelector('#tableSP thead'),
        rows=document.querySelectorAll('#tableSP tbody tr');
  if(!box||!head)return;
  box.style.maxHeight='';
  if(rows.length<=SP_VISIBLE_ROWS)return;
  let h=head.offsetHeight+2;
  for(let i=0;i<SP_VISIBLE_ROWS;i++)h+=rows[i].offsetHeight;
  box.style.maxHeight=h+'px';
}
window.addEventListener('resize',()=>{if(currentTab==='sp')limitSPHeight();});


/* =========================
   RENDER INVENTARIS
   ========================= */

function renderInvHorizontal(invObj){
  const table=document.getElementById('tableInv'),
        items=invObj.items||[];

  if(!items.length){
    table.innerHTML='<tbody><tr><td class="text-center text-muted p-4">'+escapeHtml(invObj.pesan||'Tidak ada data inventaris.')+'</td></tr></tbody>';
    return;
  }

  let rowTgl='<tr><th class="sticky-col">Tgl Terima</th>',
      rowNama='<tr><th class="sticky-col">Nama Aset</th>',
      rowBaik='<tr><th class="sticky-col">Kondisi Baik</th>',
      rowRingan='<tr><th class="sticky-col">Rusak Ringan</th>',
      rowBerat='<tr><th class="sticky-col">Rusak Berat</th>',
      rowJumlah='<tr class="row-jumlah"><th class="sticky-col">Jumlah Aset</th>',
      rowLokasi='<tr><th class="sticky-col">Lokasi Simpan</th>',
      rowKet='<tr><th class="sticky-col">Keterangan</th>';

  const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n;};

  items.forEach(item=>{
    const jumlah=num(item.baik)+num(item.ringan)+num(item.berat);
    rowTgl+=`<td>${item.tglTerima?escapeHtml(formatTanggal(item.tglTerima)):'-'}</td>`;
    rowNama+=`<td class="fw-bold">${escapeHtml(item.namaAset||'-')}</td>`;
    rowBaik+=`<td>${escapeHtml(num(item.baik))}</td>`;
    rowRingan+=`<td>${escapeHtml(num(item.ringan))}</td>`;
    rowBerat+=`<td>${escapeHtml(num(item.berat))}</td>`;
    rowJumlah+=`<td>${escapeHtml(jumlah)}</td>`;
    rowLokasi+=`<td>${escapeHtml(item.lokasi||'-')}</td>`;
    rowKet+=`<td>${escapeHtml(item.ket||'-')}</td>`;
  });

  table.innerHTML=`<tbody>${rowTgl}</tr>${rowNama}</tr>${rowBaik}</tr>${rowRingan}</tr>${rowBerat}</tr>${rowJumlah}</tr>${rowLokasi}</tr>${rowKet}</tr></tbody>`;
}


/* =========================
   SWITCH TAB
   ========================= */

function switchTab(tabName){
  currentTab=tabName;

  document.querySelectorAll('.stat-card').forEach(card=>card.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(pane=>pane.classList.remove('show','active'));

  document.getElementById('searchInput').value='';

  if(tabName==='surat'){
    document.getElementById('cardSurat').classList.add('active');
    document.getElementById('surat-panel').classList.add('show','active');
  }
  else if(tabName==='sp'){
    document.getElementById('cardSP').classList.add('active');
    document.getElementById('sp-panel').classList.add('show','active');
  }
  else if(tabName==='inv'){
    document.getElementById('cardInv').classList.add('active');
    document.getElementById('inv-panel').classList.add('show','active');
  }

  filterTable();
}


/* =========================
   FILTER
   ========================= */

function filterTable(){
  if(!globalData)return;

  const query=document.getElementById('searchInput').value.toLowerCase().trim();

  const totalSurat=globalData.surat?globalData.surat.length:0;
  const totalSP=globalData.sp?globalData.sp.length:0;
  const totalInv=globalData.inventaris&&globalData.inventaris.items
    ?globalData.inventaris.items.length:0;

  if(currentTab==='surat'){

    const filteredSurat=(globalData.surat||[]).filter(item=>
      (item.noSurat&&item.noSurat.toLowerCase().includes(query))||
      (item.perihal&&item.perihal.toLowerCase().includes(query))||
      (item.jenisSurat&&item.jenisSurat.toLowerCase().includes(query))||
      formatTanggal(item.tanggal).toLowerCase().includes(query)
    );

    document.getElementById('countSurat').innerText=filteredSurat.length;
    document.getElementById('countSP').innerText=totalSP;
    document.getElementById('countInv').innerText=totalInv;

    renderSuratHorizontal(filteredSurat);

  }else if(currentTab==='sp'){

    const filteredSP=(globalData.sp||[]).filter(item=>
      (item.noSurat&&item.noSurat.toLowerCase().includes(query))||
      (item.perihal&&item.perihal.toLowerCase().includes(query))||
      formatTanggal(item.tanggal).toLowerCase().includes(query)
    );

    document.getElementById('countSurat').innerText=totalSurat;
    document.getElementById('countSP').innerText=filteredSP.length;
    document.getElementById('countInv').innerText=totalInv;

    renderSPVertical(filteredSP);

  }else if(currentTab==='inv'){

    const invItems=(globalData.inventaris&&globalData.inventaris.items)||[];
    const filteredInv=invItems.filter(item=>
      String(item.namaAset??'').toLowerCase().includes(query)||
      String(item.lokasi??'').toLowerCase().includes(query)||
      String(item.ket??'').toLowerCase().includes(query)||
      (item.tglTerima&&formatTanggal(item.tglTerima).toLowerCase().includes(query))||
      String(item.baik??'').toLowerCase().includes(query)||
      String(item.ringan??'').toLowerCase().includes(query)||
      String(item.berat??'').toLowerCase().includes(query)
    );

    // Urut abjad A-Z berdasarkan Keterangan (yang kosong di akhir), lalu Nama Aset
    const abjad=(a,b)=>String(a??'').localeCompare(String(b??''),'id',{sensitivity:'base',numeric:true});
    filteredInv.sort((a,b)=>{
      const ka=String(a.ket??'').trim(),kb=String(b.ket??'').trim();
      if(!ka!==!kb)return ka?-1:1;
      return abjad(ka,kb)||abjad(a.namaAset,b.namaAset);
    });

    document.getElementById('countSurat').innerText=totalSurat;
    document.getElementById('countSP').innerText=totalSP;
    document.getElementById('countInv').innerText=filteredInv.length;

    renderInvHorizontal({items:filteredInv,pesan:filteredInv.length||!query?(globalData.inventaris&&globalData.inventaris.pesan):''});
  }
}
</script>
